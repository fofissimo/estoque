function dataLocalStr(d = new Date()) {
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}
function hojeStr() {
  return dataLocalStr();
}
function dataAnteriorStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, "0");

function horaAtualDecimal() {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function passouDas10h() {
  return horaAtualDecimal() >= 10;
}
function antesDoResetDiario() {
  return horaAtualDecimal() < (1 / 60);
}
function chegouAs10h() {
  return horaAtualDecimal() >= 10;
}

function formatarData(iso) {

function normalizarTexto(txt) {
  return (txt || "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}
function normalizarChave(txt) {
  return normalizarTexto(txt).replace(/[^a-z0-9]/g, "");
}

async function lerArquivoPlanilha(file) {
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
}

function lerArquivoComoDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function abrirDataUrlEmNovaAba(dataUrl, nomeArquivo) {
  try {
    const [cabecalho, base64] = dataUrl.split(",");
    const mime = (cabecalho.match(/data:(.*);base64/) || [])[1] || "application/octet-stream";
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    console.error("Não foi possível abrir o arquivo:", e);
  }
}

// Importação do PDV: usa exclusivamente o código do produto para identificar
// os 3 produtos cadastrados no sistema e a coluna "quantidade" como vendas reais.
// Nunca faz correspondência parcial por nome e nunca usa "numvendas".
function encontrarColunasPDV(linhas) {
  for (let i = 0; i < Math.min(linhas.length, 10); i++) {
    const linha = linhas[i] || [];
    let colCodigo = -1, colQuantidade = -1;
    linha.forEach((c, idx) => {
      const chave = normalizarChave(c);
      if (colCodigo === -1 && chave === "codigo") colCodigo = idx;
      if (colQuantidade === -1 && chave === "quantidade") colQuantidade = idx;
    });
    if (colCodigo !== -1 && colQuantidade !== -1) return { headerRow: i, colCodigo, colQuantidade };
  }
  return null;
}

function normalizarCodigoPDV(valor) {
  if (valor === null || valor === undefined || valor === "") return "";
  if (typeof valor === "number") return String(Math.trunc(valor));
  return String(valor).trim().replace(/\.0+$/, "");
}

function processarPlanilhaPDV(linhas) {
  const resultado = Object.fromEntries(ITEMS.map((item) => [item.id, null]));
  const colunas = encontrarColunasPDV(linhas);
  if (!colunas) throw new Error("A planilha precisa conter as colunas codigo e quantidade.");

  const porCodigo = Object.fromEntries(
    ITEMS.flatMap((item) => {
      const codigos = Array.isArray(item.codigoPDV) ? item.codigoPDV : [item.codigoPDV];
      return codigos.map((codigo) => [normalizarCodigoPDV(codigo), item.id]);
    })
  );

  for (let i = colunas.headerRow + 1; i < linhas.length; i++) {
    const linha = linhas[i] || [];
    const codigo = normalizarCodigoPDV(linha[colunas.colCodigo]);
    if (!codigo || !porCodigo[codigo]) continue;

    const qtdRaw = linha[colunas.colQuantidade];
    const qtd = typeof qtdRaw === "number" ? qtdRaw : parseFloat(String(qtdRaw).replace(",", "."));
    if (Number.isNaN(qtd)) continue;

    const itemId = porCodigo[codigo];
    resultado[itemId] = (resultado[itemId] || 0) + qtd;
  }

  return resultado;
}

// Busca todos os registros de um tipo para uma data, já preenchendo os itens sem registro com 0
async function buscarRegistros(tipo, data) {
  const { data: rows, error } = await sb
    .from("registros")
    .select("*")
    .eq("tipo", tipo)
    .eq("data", data);
  const base = Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0]));
  if (error || !rows) return { base, error: !!error };
  rows.forEach((r) => {
    if (tipo === "entrada") {
      base[r.item_id] = { qtd: r.quantidade, foto: r.foto_url, nomeArquivo: r.nome_arquivo };
    } else {
      base[r.item_id] = r.quantidade;
    }
  });
  return { base, error: false };
}

async function salvarRegistro({ item_id, data, tipo, quantidade, foto_url, nome_arquivo, registrarAlteracao = true }) {
  const payload = { item_id, data, tipo, quantidade };
  if (foto_url !== undefined) payload.foto_url = foto_url;
  if (nome_arquivo !== undefined) payload.nome_arquivo = nome_arquivo;

  const { error } = await sb
    .from("registros")
    .upsert(payload, { onConflict: "item_id,data,tipo" });

  if (!error && registrarAlteracao) {
    await sb.from("alteracoes").insert({
      aba: abaDoTipo(tipo),
      item_id,
      data,
      quantidade,
      usuario_nome: usuarioAtualNome || "Usuário",
    });
  }

  if (error) {
    console.error("Erro ao salvar registro:", error);
    return false;
  }
  return true;
}

function SparkleBurst({ triggerKey }) {
  if (!triggerKey) return null;
  const n = 6;
  return (
    <span key={triggerKey} style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      {Array.from({ length: n }).map((_, i) => {
        const angle = (i / n) * Math.PI * 2;
        const dist = 16 + (i % 2) * 6;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        return (
          <span key={i} className="sparkle-particle"
            style={{ left: "50%", top: "50%", "--dx": `${dx}px`, "--dy": `${dy}px`, animationDelay: `${i * 0.02}s` }} />
        );
      })}
    </span>
  );
}

function EntradaRow({ nome, dados, onChangeQtd, onAnexar, onRemoverAnexo, iconId, bloqueado }) {
  const fileRef = useRef(null);
  const liberado = !!dados.foto;
  const [rascunho, setRascunho] = useState(String(dados?.qtd ?? 0));

  useEffect(() => {
    setRascunho(String(dados?.qtd ?? 0));
  }, [dados?.qtd]);

  const confirmarQtd = () => {
    if (bloqueado || !liberado) return;
    const numero = Math.max(0, parseInt(rascunho || "0", 10) || 0);
    setRascunho(String(numero));
    if (numero !== Number(dados?.qtd ?? 0)) onChangeQtd(numero);
  };

  // Reduz fotos muito grandes antes de gravá-las no registro do Supabase.
  // Isso evita que uma foto de celular com vários MB falhe ao salvar e suma
  // depois de atualizar a página.
  const prepararFoto = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1400;
        const escala = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * escala));
        canvas.height = Math.max(1, Math.round(img.height * escala));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  const handleFile = async (e) => {
    if (bloqueado) return;
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await prepararFoto(file);
      await onAnexar(dataUrl, file.name);
    } catch (err) {
      console.error("Não foi possível preparar o comprovante:", err);
      alert("Não foi possível preparar a foto. Tente novamente.");
    } finally {
      e.target.value = "";
    }
  };

  const baixarAnexo = () => {
    if (!dados?.foto) return;
    const a = document.createElement("a");
    a.href = dados.foto;
    a.download = dados.nomeArquivo || `comprovante-${iconId}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", flexDirection: "column", gap: 10, opacity: bloqueado ? 0.6 : 1, minWidth: 0, width: "100%" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
          <ItemIcon id={iconId} />
          <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{nome}</span>
        </div>

        {liberado && (
          <input
            type="number"
            min="0"
            inputMode="numeric"
            value={rascunho}
            disabled={bloqueado}
            onChange={(e) => setRascunho(e.target.value)}
            onBlur={confirmarQtd}
            onKeyDown={(e) => {
              if (e.key === "Enter") e.currentTarget.blur();
            }}
            style={{
              flex: "0 0 72px",
              width: 72,
              textAlign: "center",
              fontFamily: sans,
              fontWeight: 700,
              fontSize: 15,
              border: `1px solid ${line}`,
              borderRadius: 6,
              padding: "7px 4px",
              color: ink,
              background: bloqueado ? "#f3f3f3" : "#fff"
            }}
          />
        )}
      </div>

      {liberado ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, width: "100%" }}>
          <img src={dados.foto} alt="Comprovante" style={{ flex: "0 0 44px", width: 44, height: 44, objectFit: "cover", borderRadius: 6, border: `1px solid ${line}` }} />
          <button onClick={baixarAnexo} title="Baixar comprovante" style={{
            flex: "0 0 auto", minWidth: 62, height: 44, padding: "3px 8px",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1,
            border: "1px solid #3B7A45", borderRadius: 7, background: "#3B7A45", color: "#fff",
            cursor: "pointer", fontFamily: sans, fontWeight: 800, fontSize: 11
          }}>
            <span>Baixar</span><span style={{fontSize: 15, lineHeight: 1}}>⬇</span>
          </button>
          {!bloqueado && (
            <button onClick={onRemoverAnexo} title="Excluir comprovante" style={{ ...btnStep, flex: "0 0 auto", color: danger, borderColor: danger }}>
              <Icon name="trash" size={13} />
            </button>
          )}
        </div>
      ) : (
        <>
          <label style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: `1.5px dashed ${line}`, borderRadius: 8, padding: "9px", cursor: bloqueado ? "default" : "pointer", color: accent, fontFamily: sans, fontWeight: 600, fontSize: 12.5, minWidth: 0, width: "100%" }}>
            <Icon name="paperclip" size={14} />
            Anexar comprovante de entrada
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} disabled={bloqueado} style={{ display: "none" }} />
          </label>
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: inkSoft, fontFamily: sans, fontSize: 11 }}>
            <Icon name="lock" size={12} />
            Anexe o comprovante de entrada para liberar a contagem
          </div>
        </>
      )}
    </div>
  );
}

function useDiaCarregado(tipo, dataInicial) {
  const [data, setData] = useState(dataInicial);
  const [valores, setValores] = useState(() => Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0])));
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    buscarRegistros(tipo, data).then((res) => {
      if (!ativo) return;
      setValores(res.base);
      setErro(res.error);
      setCarregando(false);
    });
    return () => { ativo = false; };
  }, [tipo, data]);

  return { data, setData, valores, setValores, carregando, erro };
}

function Estoque({ dataInicial }) {
  const [data, setData] = useState(dataInicial || hojeStr());
  const [valores, setValores] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  const carregar = async () => {
    setErro(false);
    try {
      // Primeiro tenta o valor editável salvo para o dia. Se não existir,
      // puxa automaticamente o congelamento do dia anterior.
      const { data: registrosIniciais, error: erroInicial } = await sb.from("registros")
        .select("item_id, quantidade")
        .eq("tipo", "contagem")
        .eq("data", data);
      if (erroInicial) throw erroInicial;

      let mapa = null;
      if ((registrosIniciais || []).length > 0) {
        mapa = mapaPorItens(registrosIniciais);
      } else {
        const d = new Date(`${data}T12:00:00`);
        d.setDate(d.getDate() - 1);
        const dataAnterior = dataLocalStr(d);
        const { data: fechamento, error } = await sb.from("estoque_fechamentos")
          .select("data_referencia, esperado, esperado_congelado_em")
          .eq("data_referencia", dataAnterior)
          .maybeSingle();
        if (error) throw error;
        mapa = fechamento?.esperado || null;
      }
      setValores(mapa);
    } catch (e) {
      console.error("Estoque inicial do dia:", e);
      setErro(true);
      setValores(null);
    } finally {
      setCarregando(false);
    }
  };

  useEffect(() => {
    setCarregando(true);
    carregar();
    const timer = setInterval(carregar, 10000);
    return () => clearInterval(timer);
  }, [data]);

  const mapa = valores || Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  const bloqueado = dataBloqueada(data);

  const mudar = async (id, v) => {
    if (bloqueado) return;
    const numero = Math.max(0, parseInt(String(v || "0"), 10) || 0);
    setValores(prev => ({ ...(prev || {}), [id]: numero }));
    await salvarRegistro({ item_id: id, data, tipo: "contagem", quantidade: numero });
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />

      <div style={{
        background: azulSoft, border: `1px solid ${azul}`, borderRadius: 10,
        padding: "10px 14px", textAlign: "center", fontFamily: sans,
        fontWeight: 800, fontSize: 12.5, color: azul
      }}>
        ❄️ Estoque inicial puxado do congelamento do dia anterior — você pode editar as quantidades
      </div>

      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando estoque inicial...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível carregar o estoque inicial do Supabase.</div>}

      {!carregando && !erro && (
        <ListaPorCategoria>
          {(item) => {
            const v = Number(mapa[item.id] || 0);
            return (
              <div key={item.id} style={{
                background: card, border: `1px solid ${line}`, borderRadius: 10,
                padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center",
                opacity: bloqueado ? 0.6 : 1
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <ItemIcon id={item.id} />
                  <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14, color: ink }}>{item.nome}</span>
                </div>
                <input
                  type="number" min="0" inputMode="numeric" value={v} disabled={bloqueado}
                  onChange={(e) => setValores(prev => ({ ...(prev || {}), [item.id]: e.target.value }))}
                  onBlur={(e) => mudar(item.id, e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
                  style={{
                    width: 72, textAlign: "center", fontFamily: sans, fontWeight: 800, fontSize: 16,
                    border: `1px solid ${line}`, borderRadius: 6, padding: "7px 4px",
                    color: ink, background: bloqueado ? "#f3f3f3" : "#fff"
                  }}
                />
              </div>
            );
          }}
        </ListaPorCategoria>
      )}
    </div>
  );
}

function Entradas({ dataInicial }) {
  const { data, setData, valores, setValores, carregando, erro } = useDiaCarregado("entrada", dataInicial);
  const bloqueado = dataBloqueada(data);

  const mudarQtd = async (id, v) => {
    if (bloqueado) return;
    setValores((prev) => ({ ...prev, [id]: { ...prev[id], qtd: v } }));
    await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: v });
  };
  const anexar = async (id, dataUrl, nome) => {
    if (bloqueado) return;
    const salvo = await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: valores[id].qtd, foto_url: dataUrl, nome_arquivo: nome, registrarAlteracao: false });
    if (!salvo) {
      alert("O comprovante não pôde ser salvo no Supabase. Tente novamente.");
      return;
    }
    setValores((prev) => ({ ...prev, [id]: { ...prev[id], foto: dataUrl, nomeArquivo: nome } }));
  };
  const removerAnexo = async (id) => {
    if (bloqueado) return;
    setValores((prev) => ({ ...prev, [id]: { qtd: 0, foto: null, nomeArquivo: null } }));
    await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: 0, foto_url: null, nome_arquivo: null, registrarAlteracao: false });
    const { error: erroHistorico } = await sb.from("alteracoes").insert({
      aba: "Entradas", item_id: id, data, quantidade: null,
      usuario_nome: usuarioAtualNome || "Usuário",
      arquivo_nome: `[anexo apagado] ${ITEMS.find((i) => i.id === id)?.nome || id}`,
    });
    if (erroHistorico) console.error("Não foi possível registrar a exclusão do anexo no histórico:", erroHistorico);
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />
      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível conectar ao banco de dados.</div>}
      {!carregando && (
        <ListaPorCategoria>
          {(item) => (
            <EntradaRow key={item.id} nome={item.nome} dados={valores[item.id]} iconId={item.id} bloqueado={bloqueado}
              onChangeQtd={(v) => mudarQtd(item.id, v)}
              onAnexar={(dataUrl, nome) => anexar(item.id, dataUrl, nome)}
              onRemoverAnexo={() => removerAnexo(item.id)} />
          )}
        </ListaPorCategoria>
      )}
    </div>
  );
}

// Horário oficial de Brasília obtido pela internet. Se a consulta falhar,
// o sistema mantém Vendas bloqueada em vez de confiar no relógio do aparelho.
async function obterHorarioInternetSaoPaulo() {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    const resp = await fetch("https://worldtimeapi.org/api/timezone/America/Sao_Paulo", { cache: "no-store", signal: controller.signal });
    clearTimeout(timer);
    if (!resp.ok) throw new Error("Falha ao consultar horário da internet");
    const dados = await resp.json();
    const dt = new Date(dados.datetime);
    if (Number.isNaN(dt.getTime())) throw new Error("Horário inválido");
    return dt;
  } catch (e) {
    console.error("Horário da internet:", e);
    return null;
  }
}

function VendasProtegido({ dataInicial, isAdmin = false }) {
  const [status, setStatus] = useState(isAdmin ? "aberto" : "consultando");

  const verificarHorario = async () => {
    if (isAdmin) {
      setStatus("aberto");
      return;
    }
    setStatus("consultando");
    const agora = await obterHorarioInternetSaoPaulo();
    setStatus(agora && horarioVendasAberto(agora) ? "aberto" : "fechado");
  };

  useEffect(() => {
    verificarHorario();
    if (isAdmin) return;
    const timer = setInterval(verificarHorario, 60000);

  useEffect(() => { buscarUltimoPdv(data); }, [data]);

    try {
      const [linhas, arquivoDataUrl] = await Promise.all([
        lerArquivoPlanilha(file),
        lerArquivoComoDataUrl(file),

      const resultado = processarPlanilhaPDV(linhas);

      // Zera todos os produtos antes de aplicar o novo arquivo importado

        await salvarRegistro({ item_id: item.id, data, tipo: "venda", quantidade: 0, registrarAlteracao: false });
        novosValores[item.id] = 0;

      for (const item of ITEMS) {
        if (resultado[item.id] !== null) {
          await salvarRegistro({ item_id: item.id, data, tipo: "venda", quantidade: resultado[item.id], registrarAlteracao: false });
          novosValores[item.id] = resultado[item.id];
          encontrados.push(`${item.nome}: ${resultado[item.id]}`);
        } else {
          naoEncontrados.push(item.nome);

      // Guarda o arquivo importado para consulta posterior (1 por dia — a última importação substitui a anterior)
      await sb.from("pdv_importacoes").upsert({

        arquivo_nome: file.name,

      await buscarUltimoPdv(data);

  const apagarUltimoPdv = async () => {

      const { error: erroHistorico } = await sb.from("alteracoes").insert({
        aba: "Vendas",
        item_id: null,

        quantidade: null,

      });

      setUltimoPdv(null);
      setResumoImport(null);

// =========================
// CICLO AUTOMÁTICO DIÁRIO
// 23:30: congela o estoque do dia usando exclusivamente:
// estoque inicial do dia + entradas - perdas. Vendas são desconsideradas.
// No dia seguinte, às 10:00, o congelamento anterior é confrontado com:
// estoque inicial do dia + vendas do dia.
// =========================

async function lerMapaRegistrosPermitidos(data) {
  const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  const [inicial, entradas, perdas] = await Promise.all([
    sb.from("registros").select("item_id, quantidade").eq("tipo", "contagem").eq("data", data),
    sb.from("registros").select("item_id, quantidade").eq("tipo", "entrada").eq("data", data),
    sb.from("registros").select("item_id, quantidade").eq("tipo", "perda").eq("data", data),
  ]);
  if (inicial.error || entradas.error || perdas.error) throw new Error("Não foi possível ler os registros do dia.");
  (inicial.data || []).forEach(r => { mapa[r.item_id] += Number(r.quantidade) || 0; });
  (entradas.data || []).forEach(r => { mapa[r.item_id] += Number(r.quantidade) || 0; });
  (perdas.data || []).forEach(r => { mapa[r.item_id] -= Number(r.quantidade) || 0; });
  return mapa;
}

async function lerMapaVendas(data) {
  const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  const { data: rows, error } = await sb.from("registros")
    .select("item_id, quantidade")
    .eq("tipo", "venda")
    .eq("data", data);
  if (error) throw error;
  (rows || []).forEach(r => { mapa[r.item_id] += Number(r.quantidade) || 0; });
  return mapa;
}

function mapaPorItens(rows) {
  const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  (rows || []).forEach(r => { mapa[r.item_id] = Number(r.quantidade) || 0; });
  return mapa;
}

// O banco é a autoridade do ciclo. Esta função também funciona como fallback
// caso o cron do Supabase não tenha feito o congelamento das 23:30.
async function executarCongelamentoDas23h30() {
  const dataAlvo = hojeStr();
  const { data: existente, error } = await sb.from("estoque_fechamentos")
    .select("*").eq("data_referencia", dataAlvo).maybeSingle();
  if (error) throw error;

  // Antes de 23:30 não congela. Depois de 23:30, recalcula apenas se ainda
  // não houver um congelamento registrado para o dia.
  if (horaAtualDecimal() < 23.5) return existente || null;
  if (existente && existente.esperado_congelado_em) {
    const congeladoEm = new Date(existente.esperado_congelado_em);
    const horaCongelado = congeladoEm.getHours() + congeladoEm.getMinutes() / 60;
    if (horaCongelado >= 23.5) return existente;
  }

  const esperado = await lerMapaRegistrosPermitidos(dataAlvo);
  const payload = {
    data_referencia: dataAlvo,
    esperado,
    esperado_congelado_em: new Date().toISOString()
  };

  if (existente) {
    const { data, error: erroUpdate } = await sb.from("estoque_fechamentos")
      .update(payload).eq("data_referencia", dataAlvo).select("*").single();
    if (erroUpdate) throw erroUpdate;
    return data;
  }

  const { data, error: erroInsert } = await sb.from("estoque_fechamentos")
    .insert(payload).select("*").single();
  if (erroInsert) {
    const { data: novamente } = await sb.from("estoque_fechamentos")
      .select("*").eq("data_referencia", dataAlvo).maybeSingle();
    if (novamente) return novamente;
    throw erroInsert;
  }
  return data;
}

async function executarConfrontoDas10h() {
  const dataHoje = hojeStr();
  if (horaAtualDecimal() < 10) return null;

  const dataCongelamento = ontemStr();
  const { data: congelamento, error: erroCongelamento } = await sb.from("estoque_fechamentos")
    .select("*").eq("data_referencia", dataCongelamento).maybeSingle();
  if (erroCongelamento) throw erroCongelamento;
  if (!congelamento || !congelamento.esperado_congelado_em) {
    throw new Error("O estoque congelado de ontem às 23:30 ainda não está disponível.");
  }

  // O confronto compara exatamente:
  // estoque congelado de ontem  ==  estoque inicial de hoje + vendas de hoje.
  // Qualquer diferença é marcada como INCONSISTÊNCIA.
  const { data: registrosIniciais, error: erroInicial } = await sb.from("registros")
    .select("item_id, quantidade").eq("tipo", "contagem").eq("data", dataHoje);
  if (erroInicial) throw erroInicial;
  const inicialHoje = mapaPorItens(registrosIniciais);
  const vendasHoje = await lerMapaVendas(dataHoje);

  const linhas = ITEMS.map(item => {
    const esperadoV = Number((congelamento.esperado || {})[item.id] || 0);
    const inicialV = Number(inicialHoje[item.id] || 0);
    const vendasV = Number(vendasHoje[item.id] || 0);
    const contadoV = inicialV + vendasV;
    const diferenca = contadoV - esperadoV;
    return {
      data_referencia: dataHoje,
      item_id: item.id,
      status: diferenca !== 0 ? "alerta" : "ok",
      estoque_esperado: esperadoV,
      estoque_contado: contadoV,
      diferenca,
      executado_em: new Date().toISOString()
    };
  });

  const { error: erroInsert } = await sb.from("confrontos").insert(linhas);
  if (erroInsert) throw erroInsert;

  const historico = ITEMS.map(item => {
    const l = linhas.find(x => x.item_id === item.id);
    const inicial = (registrosIniciais || []).find(r => r.item_id === item.id);
    return {
      data_hora: l.executado_em,
      item_id: l.item_id,
      item_nome: nomeDoItem(l.item_id),
      inicio_dia: inicial ? Number(inicial.quantidade) || 0 : 0,
      entradas: 0,
      perdas: 0,
      vendas: Number(vendasHoje[item.id] || 0),
      esperado: l.estoque_esperado,
      contado: l.estoque_contado,
      diferenca: l.diferenca,
      status: l.status
    };
  });
  const { error: erroHistorico } = await sb.from("confronto_historico").insert(historico);
  if (erroHistorico) throw erroHistorico;

  const { data: atualizado, error: erroUpdate } = await sb.from("estoque_fechamentos")
    .update({ confronto_executado_em: new Date().toISOString() })
    .eq("data_referencia", dataCongelamento)
    .is("confronto_executado_em", null)
    .select("*").single();
  if (erroUpdate) throw erroUpdate;
  return atualizado;
}

// O ciclo oficial agora é executado pelo Supabase (pg_cron), sem depender
// de o navegador estar aberto. Ao abrir o site, fazemos também uma chamada
// de recuperação: se algum ciclo ficou pendente, o banco o executa.
function agendarCicloAutomatico(onResultado) {
  let cancelado = false;
  const verificar = async () => {
    if (cancelado) return;
    try {
      const { data, error } = await sb.rpc("executar_ciclo_estoque_automatico");
      if (error) throw error;
      if (onResultado) onResultado(data);
    } catch (e) {
      console.error("Ciclo automático diário:", e);
    }
  };
  verificar();
  // Apenas sincronização/recuperação da interface. O horário oficial é do banco.
  const timer = setInterval(verificar, 60000);
  return () => { cancelado = true; clearInterval(timer); };
}

function mapasIguais(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Number(a[k] || 0) === Number(b[k] || 0));
}

function EstoqueEsperadoDia() {
  const [carregando, setCarregando] = useState(true);
  const [resultadoAtual, setResultadoAtual] = useState(null);
  const [congelado, setCongelado] = useState(null);
  const [mostrarCongelado, setMostrarCongelado] = useState(false);
  const [pausado, setPausado] = useState(false);
  const [erro, setErro] = useState(false);

  const buscarUltimoCongelado = async () => {
    const { data, error } = await sb.from("estoque_fechamentos")
      .select("*")
      .not("esperado_congelado_em", "is", null)
      .order("esperado_congelado_em", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (error) throw error;
    return data || null;
  };

  const calcular = async () => {
    setErro(false);
    try {
      setPausado(false);
      const novoResultado = await lerMapaRegistrosPermitidos(hojeStr());
      setResultadoAtual(prev => mapasIguais(prev, novoResultado) ? prev : novoResultado);

      const novoCongelado = await buscarUltimoCongelado();

function Confronto() {
  const [confrontos, setConfrontos] = useState([]);

  const [abertos, setAbertos] = useState({});
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  const carregar = async () => {
    setErro(false);
    try {
      const [c, f] = await Promise.all([
        sb.from("confrontos").select("*").order("executado_em", { ascending: false }).limit(Math.max(ITEMS.length * 31, 300)),
        sb.from("estoque_fechamentos").select("*").not("esperado_congelado_em", "is", null).order("data_referencia", { ascending: false }).limit(31),
      ]);
      if (c.error) throw c.error;
      if (f.error) throw f.error;
      setConfrontos(c.data || []);
      setCongelamentos(f.data || []);
    } catch (e) {
      console.error("Confronto:", e);
      setErro(true);
    }
    setCarregando(false);
  };

  useEffect(() => {
    carregar();
    const timer = setInterval(carregar, 60000);
    return () => clearInterval(timer);
  }, []);

  const grupos = {};
  confrontos.forEach(r => {
    if (!grupos[r.data_referencia]) grupos[r.data_referencia] = [];
    grupos[r.data_referencia].push(r);
  });
  const diasConfronto = Object.keys(grupos).sort((a,b) => b.localeCompare(a));

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>

      </div>

      <div style={{ height: 1, background: line, margin: "2px 0" }} />

      <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 14, color: ink, textAlign: "center" }}>

      {!carregando && congelamentos.length === 0 && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Nenhum estoque congelado encontrado.</div>}
      {congelamentos.map(f => {
        const aberto = !!abertos[`f-${f.data_referencia}`];
        return (
          <div key={f.data_referencia} style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <button

}

function formatBytesAdmin(bytes) {
  if (bytes == null || isNaN(bytes)) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let n = Number(bytes), u = 0;
  while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
  return `${n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)} ${units[u]}`;
}

                  <b style={{color:ink}}>Fotos antigas:</b> as fotos do sistema ficam armazenadas dentro dos registros como dados de imagem; a limpeza de registros com mais de 7 dias também remove essas fotos do banco.
                </div>
                <button onClick={atualizar} disabled={carregando} style={{padding:"10px",border:`1px solid ${line}`,borderRadius:9,background:card,color:accent,fontWeight:800}}>↻ Atualizar</button>
                <button onClick={limpar} disabled={limpando} style={{padding:"10px",border:"none",borderRadius:9,background:danger,color:"#fff",fontWeight:800}}>
                  {limpando ? "Limpando..." : "Apagar dados com mais de 7 dias"}
                </button>
              </div>
            )}
            {!carregando && !dados && (
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                <div style={{fontFamily:sans,fontSize:12,color:inkSoft,textAlign:"center",padding:"6px 0"}}>Não foi possível carregar os dados do painel.</div>
                <button onClick={atualizar} style={{padding:"10px",border:`1px solid ${line}`,borderRadius:9,background:card,color:accent,fontWeight:800}}>↻ Tentar novamente</button>
              </div>
            )}
            {!carregando && msg && <div style={{fontFamily:sans,fontSize:11,color:msg.startsWith("Limpeza")?good:danger,textAlign:"center",marginTop:8}}>{msg}</div>}
          </div>
        </div>
      )}
    </>
  );
}


async function sincronizarItensCardapio() {
  try {
    if (!ITEMS.length) return;
    const { error } = await sb.from("itens").upsert(
      ITEMS.map((item) => ({ id: item.id, nome: item.nome })),
      { onConflict: "id" }
    );
    if (error) {
      console.error("Não foi possível sincronizar o cardápio com public.itens:", error);
    }
  } catch (e) {
    console.error("Erro ao sincronizar o cardápio:", e);
  }
}

async function carregarPerfilAtual(session) {
  if (!session?.user?.id) return null;
  const { data, error } = await sb
    .from("perfis")
    .select("id, usuario, nome, permissoes")
    .eq("id", session.user.id)
    .single();

  if (error || !data) return null;
  const nomeAtual = data.nome || data.usuario;
  usuarioAtualNome = nomeAtual;

  // Garante que todo item presente no cardápio também exista em public.itens.
  // Itens já existentes são apenas atualizados com o nome atual.
  await sincronizarItensCardapio();

  return {
    id: data.id,
    nome: nomeAtual,
    usuario: data.usuario,
    permissoes: Array.isArray(data.permissoes) ? data.permissoes : []
  };
}

async function autenticarPorUsuario(usuario, senha) {
  const nomeUsuario = usuario.trim();
  if (!nomeUsuario || !senha) throw new Error("Informe usuário e senha.");

  // O nome de usuário é convertido para o e-mail do Auth por uma função SQL.
  // A senha nunca é consultada nem armazenada pelo JavaScript.
  const { data: email, error: erroEmail } = await sb
    .rpc("obter_email_login", { p_usuario: nomeUsuario });

  if (erroEmail || !email) throw new Error("Usuário ou senha incorretos.");

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password: senha
  });

  if (error || !data?.session) throw new Error("Usuário ou senha incorretos.");

  const perfil = await carregarPerfilAtual(data.session);
  if (!perfil) {
    await sb.auth.signOut();
    throw new Error("Usuário autenticado, mas sem perfil de acesso configurado.");
  }
  return perfil;
}

function Login({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [senha, setSenha] = useState("");
  const [mostrarSenha, setMostrarSenha] = useState(false);
  const [erro, setErro] = useState("");
  const [entrando, setEntrando] = useState(false);

  const entrar = async () => {
    if (entrando) return;
    setErro("");
    setEntrando(true);
    try {
      const perfil = await autenticarPorUsuario(usuario, senha);
      onLogin(perfil);
    } catch (e) {
      setErro(e?.message || "Usuário ou senha incorretos.");
    } finally {
      setEntrando(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:bgStripes,display:"flex",alignItems:"center",justifyContent:"center",padding:20,boxSizing:"border-box",fontFamily:sans}}>
      <div style={{width:"min(360px,100%)",background:card,border:`1px solid ${line}`,borderRadius:20,boxShadow:"0 16px 40px rgba(59,42,30,0.18)",padding:22,boxSizing:"border-box"}}>
        <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:22,color:ink,textAlign:"center",marginBottom:4}}>Estoque Fofíssimo</div>
        <div style={{fontFamily:sans,fontSize:11,color:inkSoft,textAlign:"center",marginBottom:20}}>Entre com seu usuário para acessar o sistema</div>
        <label style={{display:"block",fontFamily:sans,fontSize:11.5,fontWeight:700,color:ink,marginBottom:5}}>Usuário</label>
        <input value={usuario} onChange={e=>{setUsuario(e.target.value);setErro("");}} onKeyDown={e=>{if(e.key==="Enter")entrar();}} autoComplete="username"
          style={{width:"100%",boxSizing:"border-box",padding:"11px 12px",border:`1px solid ${line}`,borderRadius:9,fontFamily:sans,fontSize:14,marginBottom:11}} />
        <label style={{display:"block",fontFamily:sans,fontSize:11.5,fontWeight:700,color:ink,marginBottom:5}}>Senha</label>
        <div style={{position:"relative",width:"100%",marginBottom:11}}>
          <input type={mostrarSenha ? "text" : "password"} value={senha}
            onChange={e=>{setSenha(e.target.value);setErro("");}}
            onKeyDown={e=>{if(e.key==="Enter")entrar();}}
            autoComplete="current-password"
            style={{width:"100%",boxSizing:"border-box",padding:"11px 42px 11px 12px",border:`1px solid ${line}`,borderRadius:9,fontFamily:sans,fontSize:14}} />
          <button
            type="button"
            onClick={()=>setMostrarSenha(v=>!v)}
            aria-label={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
            title={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
            style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",width:30,height:30,border:"none",background:"transparent",color:inkSoft,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}
          >
            <Icon name="eye" size={18} color={inkSoft} />
          </button>
        </div>
        {erro && <div style={{fontFamily:sans,fontSize:11.5,color:danger,textAlign:"center",marginBottom:10}}>{erro}</div>}
        <button onClick={entrar} disabled={entrando} style={{width:"100%",padding:"11px",border:"none",borderRadius:9,background:entrando?accentSoft:accent,color:entrando?inkSoft:"#fff",fontFamily:sans,fontWeight:800,cursor:entrando?"default":"pointer"}}>
          {entrando ? "Entrando..." : "Entrar"}
        </button>
      </div>
    </div>
  );
}

function InstrucoesInicio({ permissoes }) {
  const instrucoes = {
    estoque: ["Estoque inicial do dia", <>Quantidade disponível de cada item no início da operação <b>(é puxada automaticamente do congelamento do dia anterior e pode ser editada)</b>.</>],
    entradas: ["Entradas", <>Quantidade de cada item que chegou no estoque naquele dia <b>(deve ser digitada manualmente nos dias que chegarem itens no estoque)</b>.<div style={{marginTop:6,fontWeight:800,color:danger}}>É NECESSÁRIO ANEXO DE COMPROVANTE PARA CONFIRMAR ENTRADAS.</div></>],
    perdas: ["Perdas", <>Todos os itens fora da condição de uso ou venda devem ser adicionados manualmente aqui.</>],
    financeiro: ["Vendas", <>As vendas do dia só podem ser importadas diretamente do PDV, <b>não podendo ser digitadas manualmente</b>.</>],
    historico: ["Histórico", <>Consulte as alterações registradas no sistema para acompanhar os lançamentos realizados.</>]
  };
  const ids = ["estoque","entradas","perdas","financeiro","historico"].filter(id=>permissoes.includes(id));

  return (
    <div style={{flex:1,minHeight:0,overflowY:"auto",padding:"18px 16px 22px",boxSizing:"border-box"}}>
      <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:18,color:ink,marginBottom:14,textAlign:"center"}}>Como utilizar o sistema</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {ids.map(id => <div key={id} style={{background:id==="estoque"?accentSoft:"#F7F2EC",border:`1px solid ${line}`,borderRadius:12,padding:"12px 13px"}}>
          <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:13.5,color:accent,marginBottom:5}}>{instrucoes[id][0]}</div>
          <div style={{fontFamily:sans,fontSize:11.5,lineHeight:1.45,color:ink}}>{instrucoes[id][1]}</div>
        </div>)}
      </div>
    </div>
  );
}

function App() {
  const [usuario, setUsuario] = useState(null);
  const [tab, setTab] = useState(null);
  const [carregandoSessao, setCarregandoSessao] = useState(true);
  const [boasVindas, setBoasVindas] = useState(false);

  useEffect(() => {
    if (!boasVindas) return;
    const t = setTimeout(() => setBoasVindas(false), 3500);
    return () => clearTimeout(t);
  }, [boasVindas]);

  useEffect(() => {
    let ativo = true;

    sb.auth.getSession().then(async ({ data }) => {
      if (!ativo) return;
      if (data?.session) {
        const perfil = await carregarPerfilAtual(data.session);
        if (ativo && perfil) setUsuario(perfil);
      }
      if (ativo) setCarregandoSessao(false);
    });

    const { data: listener } = sb.auth.onAuthStateChange(async (_event, session) => {
      if (!ativo) return;
      if (!session) {
        setUsuario(null);
        setTab(null);
        return;
      }
      const perfil = await carregarPerfilAtual(session);
      if (ativo) setUsuario(perfil);
    });

    return () => {
      ativo = false;
      listener?.subscription?.unsubscribe();
    };
  }, []);

  if (carregandoSessao) {
    return (
      <div style={{minHeight:"100vh",background:bgStripes,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:sans,color:inkSoft}}>
        Carregando...
      </div>
    );
  }

  if (!usuario) return <Login onLogin={dados => { setUsuario(dados); setTab(null); setBoasVindas(true); }} />;

  const tabsPermitidas = TABS.filter(t => usuario.permissoes.includes(t.id));

  const sair = async () => {
    await sb.auth.signOut();
    usuarioAtualNome = "";
    setUsuario(null);
    setTab(null);
  };

  return (
    <>
      <CicloAutomaticoGlobal />
      <SupabasePainel />
      {boasVindas && (
        <div style={{position:"fixed",top:18,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:"linear-gradient(135deg,#5A341C,#7A4A22)",color:"#fff",padding:"12px 22px",borderRadius:12,boxShadow:"0 10px 26px rgba(59,42,30,0.35)",fontFamily:sansArredondado,fontWeight:800,fontSize:14,textAlign:"center"}}>
          Bem-vindo(a), {usuario.nome}!
        </div>
      )}
      <div style={{minHeight:"100vh",background:bgStripes,display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 0",fontFamily:sans}}>
        <div style={{width:390,maxWidth:"100%",background:card,borderRadius:20,border:`1px solid ${line}`,boxShadow:"0 16px 40px rgba(59,42,30,0.18)",overflow:"hidden",display:"flex",flexDirection:"column",height:720,flexShrink:0}}>
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            <div style={{width:96,flexShrink:0,background:accentSoft,padding:"14px 8px",display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
              {tabsPermitidas.map(t => <button key={t.id} onClick={async ()=>{
                if (t.id === "financeiro") {
                  const agora = await obterHorarioInternetSaoPaulo();
                  setTab("financeiro");
                  return;
                }
                setTab(t.id);
              }} style={{border:tab===t.id?"1px solid #5A341C":`1.5px solid ${line}`,borderRadius:14,padding:"12px 4px",cursor:"pointer",aspectRatio:"1 / 1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,background:tab===t.id?"linear-gradient(135deg,#5A341C,#7A4A22)":card,color:tab===t.id?"#fff":accent,boxShadow:tab===t.id?"0 4px 10px rgba(90,52,28,0.45)":"0 1px 3px rgba(59,42,30,0.08)"}}>
                <Icon name={t.icone} size={18} color={tab===t.id?"#fff":accent} />
                <span style={{fontFamily:sansArredondado,fontWeight:800,fontSize:13.5,lineHeight:1.2,textAlign:"center"}}>{t.label}</span>
              </button>)}
            </div>
            <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{padding:"16px 16px 10px 20px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                  <div>
                    <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:18,color:ink,marginBottom:2}}>Estoque Fofíssimo</div>
                    <div style={{fontFamily:sans,fontSize:10.5,color:inkSoft}}>Usuário: <b>{usuario.nome}</b></div>
                  </div>
                  <button onClick={sair} style={{border:`1px solid ${line}`,borderRadius:8,background:card,color:accent,padding:"6px 8px",fontFamily:sans,fontSize:10.5,fontWeight:800,cursor:"pointer"}}>Sair</button>
                </div>
              </div>
              <div key={tab||"inicio"} className={tab?"tab-fan-enter":""} style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
                {!tab && <InstrucoesInicio permissoes={usuario.permissoes} />}
                {tab==="estoque" && <Estoque dataInicial={hojeStr()} />}
                {tab==="entradas" && <EntradasProtegido dataInicial={hojeStr()} />}
                {tab==="perdas" && <PerdasProtegido dataInicial={hojeStr()} />}

          <span style={{fontSize:15,lineHeight:1}}>🔮</span>
          <span>Fofinator</span>
        </a>
      </div>
    </>
  );
}
